name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/pos/backend/**"
      - "apps/admin-dashboard/backend/**"
      - "apps/license-server/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  OWNER: bloomtechmain

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: pos-backend
            context: apps/pos/backend
          - service: admin-backend
            context: apps/admin-dashboard/backend
          - service: license-server
            context: apps/license-server
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy via SSM
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=["sudo -u ec2-user -i bash -c '\''cd retail-pos && git pull --ff-only && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d && sleep 5 && curl -fsS http://localhost:5000/health && curl -fsS http://localhost:5001/health && curl -fsS http://localhost:3001/ -o /dev/null && docker image prune -f'\''"]' \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --query "Status" --output text)

          echo "Deploy status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" --output text
            exit 1
          fi
